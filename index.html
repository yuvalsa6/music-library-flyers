        '<div class="gr"><div class="k">'+(code?'החלפת ספרייה':'הזנת קוד ספרייה')+'</div><button id="cchg">'+(code?'החלף קוד':'הזן קוד')+'</button></div></div>':'')+
      '<div class="ver">ספריית שמע לאימונים · גרסה '+APP_VER+'</div></div>';
    document.body.appendChild(o);
    const st=$('store');o.querySelector('#stg').appendChild(st);storeOpen=true;st.hidden=!D;if(D){st._h='';storeUI()}else{o.querySelector('#stg').innerHTML='<div class="gr"><div class="k" style="color:var(--muted)">האחסון בענן זמין אחרי חיבור לספרייה</div></div>'}
    upd();
    const close=()=>{o.classList.add('out');setTimeout(()=>{$('app').insertBefore(st,$('sv').nextSibling);o.remove()},200)};
    o.onclick=e=>{if(e.target===o)close()};o.querySelector('.sh button').onclick=close;
    const cs=o.querySelector('#cshow');if(cs)cs.onclick=()=>{$('cv').textContent=code;cs.remove()};
    const cl=o.querySelector('#clink');if(cl)cl.onclick=async()=>{const u=location.origin+location.pathname+'#code='+code;
      try{if(navigator.share){await navigator.share({title:'ספריית שמע לאימונים',text:'הקישור לספריית השמע שלנו',url:u});return}await navigator.clipboard.writeText(u);cl.textContent='✓ הועתק'}catch(e){if(e&&e.name==='AbortError')return;prompt('העתק את הקישור:',u)}};
    const cc=o.querySelector('#cchg');if(cc)cc.onclick=()=>{close();setTimeout(()=>window.libCodeDialog&&libCodeDialog(),220)};
  }
  pill.onclick=sheet;$('setbtn').onclick=sheet;


  /* אייקונים: מחליפים סימני טקסט (⋯ ＋ ✕ ▾ ✎ ☰ ✓) באייקונים מצוירים, בלי לגעת בלוגיקה */
  const GL={'⋯':['more','עוד'],'＋':['plus','הוסף'],'✕':['close','סגירה'],'×':['close','מחיקה'],'▾':['down','הקטנה'],'▴':['up','הרחבה'],'✎':['pencil','עריכה'],'☰':['grip','גרור כדי לסדר'],'✓':['check','בוצע'],'←':['left','הבא'],'→':['right','הקודם']};
  const PRE={'＋':'plus','✓':'check','✕':'close'};
  const iconify=root=>{(root.querySelectorAll?root:document).querySelectorAll('button,label.sm,label.btn,.qadd,.more,[aria-label="גרור כדי לסדר"]').forEach(b=>{
    if(b.closest('#lcx')||b.dataset.ic===b.textContent)return;const t=b.textContent.trim();
    if(GL[t]&&!b.querySelector('svg')){b.innerHTML=ICX[GL[t][0]].replace('<svg ','<svg width="22" height="22" ');if(!b.getAttribute('aria-label'))b.setAttribute('aria-label',GL[t][1]);if(b.classList.contains('ico'))b.classList.add('gi-only');b.dataset.ic=b.textContent;return}
    const m=t.match(/^([＋✓✕])\s+(.+)$/);if(m&&!b.querySelector('svg')){b.innerHTML=ICX[PRE[m[1]]].replace('<svg ','<svg class="gi" ')+'<span>'+m[2].replace(/[<>&]/g,'')+'</span>';b.dataset.ic=b.textContent}})};
  let icT=0;new MutationObserver(()=>{if(icT)return;icT=requestAnimationFrame(()=>{icT=0;iconify(document)})}).observe(document.body,{childList:true,subtree:true,characterData:true});iconify(document);
  /* הנגן מוסתר כשאין שיר פתוח, שליטה מרחוק או מכשיר אחר להתחבר אליו */
  let lastIdle=null;
  let lastBar=null;
  const idleChk=()=>{const noSong=!curId&&!remote,idle=noSong&&$('devbar').hidden,bar=noSong&&!idle;
    if(idle!==lastIdle||bar!==lastBar){lastIdle=idle;lastBar=bar;document.body.classList.toggle('noplay',idle);document.body.classList.toggle('idlebar',bar);requestAnimationFrame(pad)}};
  $('fs').addEventListener('click',()=>{$('player').scrollTop=0},true);
  setInterval(idleChk,300);idleChk();

  /* הנגן הפתוח: מקטעים עם כותרות */
  const pin=document.querySelector('#player .pin'),rowOf=id=>$(id)&&$(id).closest('.ctrl');
  const sec=(t,nodes,cls)=>{const s=document.createElement('section');s.className='psec'+(cls?' '+cls:'');const h=document.createElement('h4');h.textContent=t;s.appendChild(h);nodes.filter(Boolean).forEach(n=>s.appendChild(n));return s};
  const loopRow=rowOf('la'),playRow=rowOf('spd'),runRow=rowOf('lok'),gotoRow=rowOf('gt');
  if(pin&&loopRow&&playRow){
    pin.append(sec('קטעים וחזרות',[loopRow,$('segs')]),sec('השמעה',[playRow,gotoRow]),sec('תיעוד ריצה',[runRow],'nofull'),sec('הערות',[$('note')],'nofull'));
    gotoRow&&gotoRow.classList.remove('nofull');
  }
})();
</script>
<script>
/* אייפון: אחרי שהמקלדת נסגרת הדף לפעמים נשאר מוזז, והלחיצות נוחתות במקום אחר ממה שרואים. מחזירים למקום */
{const fix=()=>{if(window.scrollY||window.scrollX)window.scrollTo(0,0)};document.addEventListener('focusout',()=>setTimeout(fix,60));if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(fix,60));addEventListener('orientationchange',()=>setTimeout(fix,300))}
/* עדכון אוטומטי: כשהאפליקציה נפתחת או חוזרת למסך, בודקים אם יש גרסה חדשה.
   כשהיא מוכנה, מרעננים לבד, אבל לא באמצע שיר ולא כשחלון פתוח: אז מציגים פס "גרסה חדשה" ללחיצה. */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadSW=!!navigator.serviceWorker.controller;let reloading=false;
  const busy=()=>!au.paused||document.querySelector('.pkov,#lcx,.cfx,.whov')||!$('ask').hidden;
  const reload=()=>{if(reloading)return;reloading=true;location.reload()};
  const offer=()=>{if(!busy())return reload();let b=$('updbar');if(b)return;b=document.createElement('button');b.id='updbar';
    b.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:120;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:10px 18px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer';
    b.textContent='גרסה חדשה מוכנה · לחץ לעדכון';b.onclick=reload;document.body.appendChild(b);
    au.addEventListener('pause',()=>{if(!busy())reload()},{once:true})};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW)offer()});
  const check=()=>navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(check).catch(()=>{}));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  setInterval(check,30*60000);
}
</script>
