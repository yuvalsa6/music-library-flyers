<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בדיקת מסך נעול</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#111;--muted:#6b6b70;--accent:#d7192f}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--muted:#a1a1a6;--accent:#ff4d5e}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
main{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
button,label.b{display:block;width:100%;box-sizing:border-box;min-height:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:700;text-align:center;padding:13px;margin-bottom:10px;cursor:pointer}
label.b.g{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
audio{width:100%;margin-top:6px}
ol{margin:0;padding-inline-start:20px}
li{margin-bottom:6px}
#st{font-size:14px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>בדיקת מסך נעול</h1>
<p>דף בדיקה בלבד, נפרד מהאפליקציה. יש בו רק נגן פשוט, בלי שום דבר אחר.</p>
<div class="card">
  <button id="tone">בדיקה 1: מנגינת בדיקה מהאתר</button>
  <label class="b g" for="f">בדיקה 2: שיר מהטלפון</label>
  <input type="file" id="f" accept="audio/*" hidden>
  <audio id="a" controls playsinline></audio>
  <div id="st"></div>
</div>
<div class="card">
  <b>מה עושים</b>
  <ol>
    <li>לוחצים על אחת הבדיקות, והמוזיקה מתחילה.</li>
    <li>נועלים את הטלפון.</li>
    <li>במסך הנעול עוצרים.</li>
    <li>מחכים 20 שניות ולוחצים "הפעלה".</li>
  </ol>
  <p style="margin-top:8px">מה קרה: חזר לנגן, או עבר לאפל מיוזיק?</p>
</div>
</main>
<script>
const a=document.getElementById('a'),st=document.getElementById('st');
function meta(t){try{navigator.mediaSession.metadata=new MediaMetadata({title:t,artist:'בדיקת מסך נעול'})}catch(e){}}
function go(src,t){a.src=src;meta(t);a.play().then(()=>{st.textContent='מנגן: '+t}).catch(e=>{st.textContent='לא הצליח לנגן: '+e.message})}
document.getElementById('tone').onclick=()=>go('tone.wav','מנגינת בדיקה');
document.getElementById('f').onchange=e=>{const f=e.target.files[0];if(f)go(URL.createObjectURL(f),f.name.replace(/\.[^.]+$/,''))};
</script>
</body>
</html>
